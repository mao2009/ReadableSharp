name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore ReadableSharp.sln
      - run: dotnet build ReadableSharp.sln --configuration Release --no-restore
      - run: dotnet test ReadableSharp.sln --configuration Release --no-build
